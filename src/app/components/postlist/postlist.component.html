<mat-toolbar color="primary">
  <span>Mi Aplicación</span>
</mat-toolbar>

<div style="padding: 16px;">
  <mat-card>
    <mat-card-header>
      <mat-card-title>My Post</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <button mat-raised-button color="primary" (click)="addPost()">Añadir Post</button>

      <mat-card *ngFor="let post of posts" class="post-card">
        <mat-card-header>
          <mat-card-title>{{ post.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ post.content }}</p>
        </mat-card-content>
      </mat-card>
    </mat-card-content>
  </mat-card>
</div>
