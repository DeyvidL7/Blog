<mat-toolbar color="primary">
  <span>Mi Aplicación de Publicaciones</span>
</mat-toolbar>

<div style="padding: 16px;">
  <button mat-raised-button color="primary" (click)="addPost()">Añadir Post</button>

  <div>
    <app-post-card
      *ngFor="let post of posts"
      [post]="post"
      (deletePost)="deletePost($event)"
    ></app-post-card>
  </div>
</div>
