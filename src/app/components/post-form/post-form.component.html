<h2 mat-dialog-title>{{ data ? 'Editar' : 'Nueva' }} Publicación</h2>
    
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      <mat-dialog-content>
        <div class="form-container">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Título</mat-label>
            <input matInput formControlName="title" placeholder="Ingrese el título">
            <mat-error *ngIf="postForm.get('title')?.hasError('required')">
              El título es requerido
            </mat-error>
            <mat-error *ngIf="postForm.get('title')?.hasError('minlength')">
              El título debe tener al menos 3 caracteres
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Contenido</mat-label>
            <textarea matInput formControlName="content" rows="4" 
                      placeholder="Ingrese el contenido"></textarea>
            <mat-error *ngIf="postForm.get('content')?.hasError('required')">
              El contenido es requerido
            </mat-error>
            <mat-error *ngIf="postForm.get('content')?.hasError('minlength')">
              El contenido debe tener al menos 10 caracteres
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Autor</mat-label>
            <input matInput formControlName="author" placeholder="Ingrese el autor">
            <mat-error *ngIf="postForm.get('author')?.hasError('required')">
              El autor es requerido
            </mat-error>
          </mat-form-field>
        </div>
      </mat-dialog-content>

      <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close type="button">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" 
                [disabled]="postForm.invalid">
          {{ data ? 'Actualizar' : 'Crear' }}
        </button>
      </mat-dialog-actions>
    </form>
