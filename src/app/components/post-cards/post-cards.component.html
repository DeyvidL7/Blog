<mat-card class="post-card">
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <mat-card-subtitle>
      Por {{ post.author }} | {{ post.date | date }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ post.content }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="onEdit()">  <!-- Asegúrate que esté este evento -->
      <mat-icon>edit</mat-icon>
      Editar
    </button>
    <button mat-button color="warn" (click)="onDelete()">
      <mat-icon>delete</mat-icon>
      Eliminar
    </button>
  </mat-card-actions>
</mat-card>
