<mat-card class="post-card" (click)="onViewDetails()">
  <mat-card-header>
    <mat-card-title>{{ post.title }}</mat-card-title>
    <mat-card-subtitle>
      Por {{ post.author }} | {{ post.created_at | date }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ post.content | slice:0:100 }}{{ post.content.length > 100 ? '...' : '' }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary" (click)="onEdit($event)">
      <mat-icon>edit</mat-icon>
      Editar
    </button>
    <button mat-button color="warn" (click)="onDelete($event)">
      <mat-icon>delete</mat-icon>
      Eliminar
    </button>
  </mat-card-actions>
</mat-card>
