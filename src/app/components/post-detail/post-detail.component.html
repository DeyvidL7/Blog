<div class="post-detail-container" *ngIf="!isLoading && post">
  <mat-card class="post-detail-card">
    <mat-card-header>
      <mat-card-title>{{ post.title }}</mat-card-title>
      <mat-card-subtitle>
        Por {{ post.author }} | {{ post.created_at | date:'medium' }}
      </mat-card-subtitle>
    </mat-card-header>

    <img *ngIf="post.image_url" [src]="post.image_url" alt="{{ post.title }}" class="post-detail-image">

    <mat-card-content>
      <p class="post-content">{{ post.content }}</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-button color="primary" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Volver
      </button>
    </mat-card-actions>
  </mat-card>
</div>

<div *ngIf="isLoading" class="loading-container">
  <!-- <mat-spinner></mat-spinner> -->
</div>

<div *ngIf="error" class="error-container">
  <mat-error>{{ error }}</mat-error>
  <button mat-raised-button color="primary" (click)="goBack()">Volver</button>
</div>
